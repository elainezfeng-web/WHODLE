<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHODLE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--color-1) 0%, var(--color-2) 100%);
        }
        .landing-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .landing-title {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 8px;
            color: var(--color-5);
            text-align: center;
            margin-top: 60px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }
        .landing-date {
            color: var(--color-5);
            font-size: 16px;
            margin-top: 10px;
            opacity: 0.9;
        }
        .landing-instructions {
            color: var(--color-5);
            font-size: 15px;
            text-align: center;
            max-width: 400px;
            margin-top: 30px;
            line-height: 1.5;
            opacity: 0.95;
            padding: 0 10px;
        }
        .play-button {
            padding: 16px 60px;
            font-size: 24px;
            background: linear-gradient(135deg, var(--color-3) 0%, var(--color-4) 100%);
            color: var(--color-1);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.2s ease;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 60px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .play-button:hover {
            transform: scale(1.05);
        }
        .play-button:active {
            transform: scale(0.98);
        }
        @media (max-width: 480px) {
            .landing-title {
                font-size: 48px;
                letter-spacing: 4px;
                margin-top: 40px;
            }
            .landing-date {
                font-size: 14px;
            }
            .landing-instructions {
                font-size: 14px;
                margin-top: 20px;
            }
            .play-button {
                font-size: 20px;
                padding: 14px 50px;
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="landing-top">
            <h1 class="landing-title">WHODLE</h1>
            <p class="landing-date" id="landingDate"></p>
            <p class="landing-instructions">Guess the mystery person in 3 tries. Each guess gives you feedback. Like Wordle, but for people!</p>
        </div>
        <a href="game.html" class="play-button">PLAY</a>
    </div>
    <script>
        const landingDateEl = document.getElementById('landingDate');
        if (landingDateEl) {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            landingDateEl.textContent = today.toLocaleDateString(undefined, options);
        }
    </script>
</body>
</html>
