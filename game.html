<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHODLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="muteBtn" class="mute-btn" type="button" aria-label="Toggle sound">🔊</button>
    <canvas id="particleCanvas" class="particle-canvas"></canvas>
    <div id="gameContainer" class="container">
        <header>
            <h1>WH🔍DLE</h1>
            <p class="subtitle">Guess the missing info!</p>
        </header>

        <!-- Game Screen -->
        <section id="gameScreen" class="screen">
            <div class="profile-section">
                <div class="profile-header">
                    <div id="profileAvatar" class="profile-avatar" aria-label="Profile picture"></div>
                    <h2><span id="profileInitials"></span></h2>
                </div>
                <div class="profile-info">
                    <p><strong>Current:</strong> <span id="currentWorkplace"></span></p>
                    <p><strong>Location:</strong> <span id="profileLocation"></span></p>
                    <p><strong>Experiences:</strong> <span id="numExp"></span></p>
                    <p class="about-text"><strong>Description:</strong> <span id="profileAbout"></span></p>
                </div>
                <div class="question-section">
                    <p class="question-text">Where did this person <strong>previously</strong> work?</p>
                    <div class="hidden-info">
                        <p>They worked at: <span id="hiddenWorkplace" class="hidden-box">???</span></p>
                    </div>
                </div>
            </div>

            <div class="guess-section">
                <p class="attempts-text">Guesses: <span id="guessCount">0</span></p>
                <div id="optionsContainer" class="options-container">
                    <!-- Options populated by JavaScript -->
                </div>
                <p id="feedback" class="feedback" aria-live="polite"></p>
                <p id="successMessage" class="success-message" style="display: none;">You got it! 🎉</p>
            </div>
        </section>

        <!-- Summary Screen -->
        <section id="summaryScreen" class="screen" style="display: none;">
            <div class="result-section">
                <h2>Summary</h2>
                <p class="summary-text">You got it in <strong><span id="finalGuesses">0</span></strong> guess(es)!</p>
                <p class="summary-text">The answer was: <strong><span id="answerWorkplace"></span></strong></p>
                <p class="comparison-text">Compared to others, you did <span id="comparison"></span>!</p>
                <button id="playAgainBtn" class="play-again-btn" type="button">Play Again</button>
            </div>
        </section>
    </div>

    <script src="profiles_data.js"></script>
    <script src="app.js"></script>
</body>
</html>
