<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHODLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--color-1) 0%, var(--color-2) 100%);
        }
        .landing-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .landing-title {
            font-size: 72px;
            font-family: 'Tiny5', sans-serif;
            font-weight: bold;
            letter-spacing: 8px;
            color: var(--color-5);
            text-align: center;
            margin-top: 60px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }
        .landing-date {
            color: var(--color-5);
            font-size: 16px;
            margin-top: 10px;
            opacity: 0.9;
        }
        .landing-instructions {
            color: var(--color-5);
            font-size: 15px;
            text-align: center;
            max-width: 400px;
            margin-top: 20px;
            line-height: 1.5;
            opacity: 0.95;
            padding: 0 10px;
        }
        .faces-container {
            display: flex;
            margin-top: 30px;
            margin-bottom: 30px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex: 1;
            position: relative;
            padding: 20px 10px;
        }
        .faces-container {
            display: flex;
            margin-top: 30px;
            margin-bottom: 30px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex: 1;
            position: relative;
            padding: 20px 10px;
            perspective: 1000px;
        }
        .face-card {
            width: 28vw;
            max-width: 180px;
            min-width: 80px;
            aspect-ratio: 1 / 1;
            background: var(--color-5);
            border: 3px solid var(--color-4);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            position: relative;
            transition: transform 0.3s ease;
            transform-style: preserve-3d;
        }
        .face-card:nth-child(1) {
            margin-right: -5%;
            z-index: 1;
            transform: rotate(-5deg);
        }
        .face-card:nth-child(2) {
            transform: scale(1.12) rotate(0deg);
            z-index: 3;
            margin: 0 -5%;
        }
        .face-card:nth-child(3) {
            margin-left: -5%;
            z-index: 2;
            transform: rotate(5deg);
        }
        .face-card:hover {
            transform: scale(1.15) rotateY(10deg) rotateX(5deg);
            z-index: 10;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        .face-card:nth-child(1):hover {
            transform: scale(1.15) rotateY(-15deg) rotateX(5deg);
        }
        .face-card:nth-child(2):hover {
            transform: scale(1.25) rotateY(0deg) rotateX(5deg);
        }
        .face-card:nth-child(3):hover {
            transform: scale(1.15) rotateY(15deg) rotateX(5deg);
        }
        .face-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .play-button {
            padding: 24px 90px;
            font-size: 32px;
            background: linear-gradient(135deg, var(--color-3) 0%, var(--color-4) 100%);
            color: var(--color-1);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.2s ease;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 40px;
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .play-button:hover {
            transform: scale(1.05);
        }
        .play-button:active {
            transform: scale(0.98);
        }
        @media (max-width: 600px) {
            .face-card {
                width: 30vw;
            }
        }
        @media (max-width: 480px) {
            .landing-title {
                font-size: 48px;
                letter-spacing: 4px;
                margin-top: 40px;
            }
            .landing-date {
                font-size: 14px;
            }
            .landing-instructions {
                font-size: 14px;
                margin-top: 15px;
            }
            .faces-container {
                margin-top: 15px;
                margin-bottom: 15px;
                padding: 10px;
            }
            .face-card {
                width: 32vw;
            }
            .face-card:nth-child(2) {
                transform: scale(1.1);
            }
            .play-button {
                font-size: 26px;
                padding: 18px 70px;
                margin-bottom: 30px;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="landing-top">
            <h1 class="landing-title">WH🔍DLE</h1>
            <p class="landing-date" id="landingDate"></p>
            <p class="landing-instructions">Guess the mystery person in 3 tries. Each guess gives you feedback. Like Wordle, but for people!</p>
            <div class="faces-container">
                <div class="face-card">
                    <img src="face1.png" alt="Mystery person 1">
                </div>
                <div class="face-card">
                    <img src="face2.png" alt="Mystery person 2">
                </div>
                <div class="face-card">
                    <img src="face3.png" alt="Mystery person 3">
                </div>
            </div>
        </div>
        <a href="game.html" class="play-button">PLAY</a>
    </div>
    <script>
        const landingDateEl = document.getElementById('landingDate');
        if (landingDateEl) {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            landingDateEl.textContent = today.toLocaleDateString(undefined, options);
        }
    </script>
</body>
</html>
