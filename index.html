<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHODLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        body {
            background: #05070a;
            font-family: 'VT323', 'Courier New', monospace;
            overflow-x: hidden;
        }

        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 28px 20px;
            position: relative;
            color: #ffb000;
            background:
                radial-gradient(ellipse at 50% 18%, rgba(255, 176, 0, 0.16) 0%, rgba(0, 0, 0, 0) 55%),
                radial-gradient(ellipse at 50% 100%, rgba(30, 40, 20, 0.55) 0%, rgba(0, 0, 0, 0) 70%),
                #05070a;
            text-shadow: 0 0 6px rgba(255, 176, 0, 0.55);
        }

        /* CRT scanlines + vignette over the whole page */
        .landing-container::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0) 0px,
                    rgba(0, 0, 0, 0) 2px,
                    rgba(0, 0, 0, 0.22) 3px,
                    rgba(0, 0, 0, 0.22) 4px
                ),
                radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.6) 100%);
            opacity: 0.9;
        }

        .landing-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .landing-cam {
            font-size: 18px;
            letter-spacing: 3px;
            color: #a87500;
            margin-top: 8px;
        }

        .landing-cam::before {
            content: '● ';
            color: #ff4b3a;
            animation: recBlink 1.4s steps(2) infinite;
        }

        .landing-title {
            font-size: 78px;
            font-family: 'Tiny5', sans-serif;
            font-weight: normal;
            letter-spacing: 10px;
            color: #ffb000;
            text-align: center;
            margin-top: 26px;
            line-height: 1;
            text-shadow:
                0 0 10px rgba(255, 176, 0, 0.85),
                0 0 34px rgba(255, 176, 0, 0.35);
        }

        .landing-logo-o {
            display: inline-block;
            animation: cursorFlicker 1.1s steps(2) infinite;
        }

        .landing-date {
            color: #a87500;
            font-size: 19px;
            letter-spacing: 2px;
            margin-top: 12px;
        }

        .landing-instructions {
            color: #4dff88;
            font-size: 20px;
            text-align: center;
            max-width: 460px;
            margin-top: 16px;
            line-height: 1.3;
            padding: 0 10px;
            text-shadow: 0 0 6px rgba(77, 255, 136, 0.4);
        }

        .faces-container {
            display: flex;
            margin-top: 30px;
            margin-bottom: 22px;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex: 1;
            position: relative;
            padding: 20px 10px;
            perspective: 1000px;
        }

        .face-card {
            width: 27vw;
            max-width: 168px;
            min-width: 84px;
            aspect-ratio: 1 / 1;
            background: #0a0c07;
            border: 2px solid #a87500;
            border-radius: 2px;
            overflow: hidden;
            box-shadow:
                0 0 18px rgba(255, 176, 0, 0.18),
                inset 0 0 30px rgba(0, 0, 0, 0.9);
            position: relative;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            transform-style: preserve-3d;
        }

        /* amber "security monitor" tint on the ID photos */
        .face-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(1) sepia(1) saturate(2.6) brightness(0.95) contrast(1.1);
            opacity: 0.9;
        }

        .face-card::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 0, 0, 0.35) 3px,
                rgba(0, 0, 0, 0.35) 4px
            );
        }

        .face-card:nth-child(1) {
            margin-right: -5%;
            z-index: 1;
            transform: rotate(-5deg);
        }
        .face-card:nth-child(2) {
            transform: scale(1.12) rotate(0deg);
            z-index: 3;
            margin: 0 -5%;
        }
        .face-card:nth-child(3) {
            margin-left: -5%;
            z-index: 2;
            transform: rotate(5deg);
        }
        .face-card:hover {
            transform: scale(1.15) rotateY(10deg) rotateX(5deg);
            z-index: 10;
            box-shadow: 0 0 34px rgba(255, 176, 0, 0.45);
        }
        .face-card:nth-child(1):hover {
            transform: scale(1.15) rotateY(-15deg) rotateX(5deg);
        }
        .face-card:nth-child(2):hover {
            transform: scale(1.22) rotateY(0deg) rotateX(5deg);
        }
        .face-card:nth-child(3):hover {
            transform: scale(1.15) rotateY(15deg) rotateX(5deg);
        }

        .play-button {
            padding: 18px 84px;
            font-size: 34px;
            letter-spacing: 6px;
            background: #ffb000;
            color: #0a0c07;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 26px;
            margin-top: 6px;
            text-shadow: none;
            box-shadow: 0 0 22px rgba(255, 176, 0, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .play-button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 38px rgba(255, 176, 0, 0.85);
        }
        .play-button:active {
            transform: scale(0.98);
        }
        .play-button::before {
            content: '> ';
            color: #5a3a00;
        }

        .landing-foot {
            font-size: 16px;
            letter-spacing: 2px;
            color: #a87500;
            margin-bottom: 4px;
            text-align: center;
        }

        @keyframes recBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.25; }
        }
        @keyframes cursorFlicker {
            0%, 60% { opacity: 1; }
            61%, 100% { opacity: 0.35; }
        }

        @media (max-width: 600px) {
            .face-card { width: 29vw; }
        }

        @media (max-width: 480px) {
            .landing-title {
                font-size: 46px;
                letter-spacing: 5px;
                margin-top: 26px;
            }
            .landing-cam { font-size: 15px; }
            .landing-date { font-size: 15px; }
            .landing-instructions {
                font-size: 17px;
                margin-top: 12px;
            }
            .faces-container {
                margin-top: 14px;
                margin-bottom: 14px;
                padding: 10px;
            }
            .face-card { width: 30vw; }
            .face-card:nth-child(2) { transform: scale(1.1); }
            .play-button {
                font-size: 27px;
                padding: 14px 58px;
                margin-bottom: 18px;
            }
            .landing-foot { font-size: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .landing-cam::before,
            .landing-logo-o { animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="landing-top">
            <p class="landing-cam">CAM 01 — NIGHT SHIFT</p>
            <h1 class="landing-title">WH<span class="landing-logo-o">🔍</span>DLE</h1>
            <p class="landing-date" id="landingDate"></p>
            <p class="landing-instructions">A new case every day. Five profiles, five missing workplaces — pick what they did before. Faster guesses, better rank.</p>
            <div class="faces-container">
                <div class="face-card">
                    <img src="face1.png" alt="Mystery person 1">
                </div>
                <div class="face-card">
                    <img src="face2.png" alt="Mystery person 2">
                </div>
                <div class="face-card">
                    <img src="face3.png" alt="Mystery person 3">
                </div>
            </div>
        </div>
        <a href="game.html" class="play-button">PLAY</a>
        <p class="landing-foot">WHODLE OS v1.0 · 5 QUESTIONS PER SHIFT</p>
    </div>
    <script>
        const landingDateEl = document.getElementById('landingDate');
        if (landingDateEl) {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            landingDateEl.textContent = today.toLocaleDateString(undefined, options);
        }
    </script>
</body>
</html>
