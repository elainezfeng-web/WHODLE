<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHODLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WHODLE</h1>
            <p class="subtitle">Guess who it is! (30-second fun)</p>
        </header>

        <!-- Main Entry Page -->
        <section id="gameScreen" class="screen">
            <div class="mystery-section">
                <h2>Mystery Person</h2>
                <div id="mysteryImage" class="mystery-image" aria-label="Mystery person placeholder"></div>
                <p class="clue-text">Look at the colored shapes and guess!</p>
            </div>

            <div class="guess-section">
                <p class="attempts-text">Attempts left: <span id="attemptsLeft">3</span></p>
                <p class="guess-label">Make a guess:</p>
                <div id="optionsContainer" class="options-container">
                    <!-- Options populated by JavaScript -->
                </div>
                <p id="feedback" class="feedback" aria-live="polite"></p>
            </div>
        </section>

        <!-- Result Page -->
        <section id="resultScreen" class="screen" style="display: none;">
            <div class="result-section">
                <h2 id="resultTitle">Result</h2>
                <div id="resultImage" class="mystery-image"></div>
                <p id="resultMessage" class="result-message"></p>
                <p class="score-text">Score: <span id="finalScore">0</span></p>
                <p class="answer-text">The answer was: <span id="answerName"></span></p>
                <button id="playAgainBtn" class="play-again-btn" type="button">Play Again</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
